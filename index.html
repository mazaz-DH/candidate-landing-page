<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open Roles — talabat</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --orange:#FF5A00;
    --orange-dark:#E64F00;
    --ink:#14142B;
    --ink-soft:#4A4A57;
    --bg:#FFFFFF;
    --bg-alt:#F5F5F5;
    --border:#ECECEC;
    --radius-lg:20px;
    --radius-pill:200px;
    --max-w:900px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Outfit', Arial, sans-serif;
    color:var(--ink);
    background:var(--bg);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}
  .wrap{max-width:var(--max-w);margin:0 auto;padding:0 24px;}

  header{
    background:var(--orange);color:#fff;padding:72px 0 56px;
  }
  .logo{font-weight:800;font-size:24px;margin-bottom:24px;}
  h1{font-size:40px;font-weight:800;margin:0 0 12px;letter-spacing:-1px;}
  header p{font-size:18px;color:rgba(255,255,255,.92);margin:0;max-width:560px;}

  main{padding:56px 0 88px;}
  .role-list{display:flex;flex-direction:column;gap:16px;}
  .role-card{
    display:flex;align-items:center;justify-content:space-between;gap:20px;
    background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);
    padding:26px 28px;transition:border-color .2s ease, transform .2s ease;
  }
  .role-card:hover{border-color:var(--orange);transform:translateY(-2px);}
  .role-info h2{font-size:19px;font-weight:700;margin:0 0 6px;}
  .role-meta{display:flex;gap:10px;flex-wrap:wrap;}
  .role-meta span{
    background:var(--bg-alt);color:var(--ink-soft);font-size:12.5px;font-weight:600;
    padding:5px 12px;border-radius:var(--radius-pill);
  }
  .role-arrow{
    flex-shrink:0;width:40px;height:40px;border-radius:50%;background:var(--bg-alt);
    color:var(--orange);display:flex;align-items:center;justify-content:center;
    font-size:18px;font-weight:800;transition:background .2s ease, color .2s ease;
  }
  .role-card:hover .role-arrow{background:var(--orange);color:#fff;}

  footer{
    border-top:1px solid var(--border);padding:28px 0;text-align:center;
    font-size:13.5px;color:var(--ink-soft);
  }

  @media (max-width:600px){
    h1{font-size:30px;}
    .role-card{flex-direction:column;align-items:flex-start;}
    .role-arrow{align-self:flex-end;}
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="logo">talabat</div>
    <h1>Open roles</h1>
    <p>We're hiring across product, design, and engineering. Pick a role below to learn more.</p>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="role-list">
      <a class="role-card" href="staff-product-designer-dubai/">
        <div class="role-info">
          <h2>Staff Product Designer</h2>
          <div class="role-meta">
            <span>📍 Dubai, UAE</span>
            <span>🎯 Product Design</span>
            <span>🕐 Full-time</span>
          </div>
        </div>
        <div class="role-arrow">→</div>
      </a>
    </div>
  </div>
</main>

<footer>
  © 2026 talabat, a Delivery Hero company.
</footer>

</body>
</html>
